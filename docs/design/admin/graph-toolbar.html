<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><link rel="stylesheet" href="styles.css">
<style>body{padding:24px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}</style></head>
<body>
<div class="api-bar" style="gap:8px;flex-wrap:wrap">
  <label>Режим</label>
  <button class="btn btn-primary">👁 Просмотр</button>
  <button class="btn btn-ghost">➕ Узел</button>

            background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--success)">
  <span>✓</span><span style="font-size:13px">Граф связный — маршрут строится между любыми узлами</span>
  <span style="margin-left:12px;font-family:var(--mono);font-size:12px;color:var(--text3)">7 узлов · 8 рёбер</span>
